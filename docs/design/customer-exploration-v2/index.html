<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review desain customer — Sisko Plan</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e9e7;color:#272522;font:14px system-ui,sans-serif}header{background:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #d3d3d0}header strong{margin-right:auto}button,select,a{font:inherit;min-height:36px;border:1px solid #ccc;border-radius:7px;background:white;padding:7px 10px;color:inherit}a{text-decoration:none}label{display:flex;align-items:center;gap:8px}.stage{height:calc(100dvh - 122px);min-height:400px;margin:16px auto;max-width:calc(100% - 24px);background:white;border:1px solid #c9c9c5;box-shadow:0 12px 36px #0000000a;transition:width .2s;overflow:hidden;border-radius:12px}iframe{display:block;width:100%;height:100%;border:0}footer{padding:0 20px 12px;font-size:12px;color:#575751}#status{margin-left:auto}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b13b21;outline-offset:2px}@media(max-width:600px){header{padding:10px;gap:8px}.stage{height:calc(100dvh - 178px);margin:10px auto}header strong{width:100%}}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header,footer{flex-shrink:0}.stage{height:auto;min-height:0;flex:1 1 0;width:1280px}iframe{height:100%}</style></head><body><header><strong>Sisko Plan · Eksplorasi customer</strong><label>Lebar <select id="width"><option value="375">375 · HP</option><option value="320">320 · HP kecil</option><option value="640">640</option><option value="768">768 · Tablet</option><option value="1024">1024</option><option value="1280" selected>1280 · Desktop</option><option value="1536">1536</option></select></label><label>Kondisi <select id="state"><option value="normal">Data contoh</option><option value="empty">Kosong</option><option value="loading">Memuat</option><option value="error">Gagal memuat</option></select></label><button id="check">Periksa lebar</button><a href="app.html" target="_blank">Buka penuh ↗</a><a href="BRIEF.md" target="_blank">Brief desain ↗</a></header><div class="stage" id="stage" style="width:1280px"><iframe id="app" src="app.html" title="Prototype customer Sisko Plan"></iframe></div><footer>Prototype terpisah · AI dan transaksi disimulasikan · Tidak mengubah data aplikasi <span id="status" role="status"></span></footer><script>
const frame=document.querySelector('#app');document.querySelector('#width').onchange=e=>document.querySelector('#stage').style.width=e.target.value+'px';document.querySelector('#state').onchange=e=>frame.contentWindow.postMessage({type:'review-state',value:e.target.value},location.origin);document.querySelector('#check').onclick=()=>{const d=frame.contentDocument;const overflow=d.documentElement.scrollWidth>frame.clientWidth+1;document.querySelector('#status').textContent=`${frame.clientWidth}px · ${overflow?'Ada overflow horizontal':'Tidak ada overflow horizontal'} · ${d.querySelector('h1')?.textContent||'Halaman'}`};
</script></body></html>
